[project]
name = "finn"
version = "0.1.0"
description = "FINN data layer: prices, exchange filings and fundamentals for Indian listed companies"
readme = "../README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "yfinance>=1.7.0",
    "pandas>=3.0.6",
    "pypdfium2>=5.14.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "tenacity>=9.1",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "google-genai>=2.29.0",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
    "pillow>=12.3.0",
    "tzdata>=2026.5",
    "fastapi>=0.143.0",
    "vercel>=0.11.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Supply-chain policy: never resolve any package, direct or transitive, released
# less than 14 days before the lock date. Brand-new releases are where regressions
# and compromised uploads show up first.
exclude-newer = "2026-10-13T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is the formatter's job

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
