# Scheduled data refresh: the Push side's heartbeat, and our test of cloud access.
#
# Every 30 minutes, around the clock, it fetches corporate actions, prices and filings,
# then commits the exported JSON. The web host redeploys on the
# commit, so the app always serves fresh static files.
#
# The database and document text are not committed. They persist between runs in the
# Actions cache, so each run only downloads what is new.
#
# Actions are pinned to full commit SHAs, not tags, so a re-pointed tag cannot change
# what runs here. Each pin is the newest release at least 14 days old when chosen.

name: refresh-data

on:
  # GitHub's cron is best effort, and for this repository it was not enough: after the
  # default branch was switched on 28 Oct 2026, scheduled runs stopped, then came hours
  # late, then not at all. So each run starts the next one itself (the last step), and
  # the cron only restarts that chain if it ever breaks. Set the repository variable
  # KEEP_REFRESHING to "false" to stop the chain.
  schedule:
    - cron: "17 * * * *"  # hourly, as a restart
  workflow_dispatch: {}
  push:  # changing this file starts the chain at once
    branches: [main]
    paths: [.github/workflows/refresh.yml]

permissions:
  contents: write
  actions: write  # to start the next run

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50  # about 15 to refresh, then waiting out the 30-minute cycle
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Note the start time
        working-directory: .
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 20  # enough history to find the last data commit

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          working-directory: backend
          enable-cache: true

      - name: Restore database and document cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data
          key: finn-data-${{ github.run_id }}
          restore-keys: finn-data-

      - name: Install
        # The pipeline group holds the price libraries, which the live server does not need.
        run: uv sync --frozen --no-dev --group pipeline

      - name: Refresh, enrich and export
        # Keys come from the repository's encrypted secrets, never from the code.
        # Without them the run still works: results cards come from XBRL, and the AI
        # stages report what they skipped.
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        # data/ does not exist on a fresh runner, and tee opens its file before Python
        # creates the folder. Without this line tee exits 1, which fails the step even
        # when every stage succeeded (first cloud run, 28 Oct 2026).
        run: |
          mkdir -p ../data
          uv run python -m finn.refresh | tee ../data/last-run.json

      - name: Answer "was this expected?" for the top cards
        # New filings arrive every run; their cards should explain themselves too. Answers
        # are cached, so only new cards cost a model call. A failure here never blocks the
        # data commit.
        continue-on-error: true
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: uv run python -m finn.research --ask 12

      - name: Update research reports their companies have outdated
        # A new call transcript or new results means a shipped report is behind. Two are
        # rebuilt per run; the rest say in the app that they are catching up. A failure
        # keeps the old report, and never blocks the data commit.
        continue-on-error: true
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: |
          out=$(uv run python -m finn.research --update 2)
          echo "$out"
          { echo "### Research reports"; echo '```json'; echo "$out" | tail -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh NSE's list of listed companies, once a day
        # The search box suggests from this list. New listings join it daily; a symbol
        # not yet in it can still be researched by typing it.
        continue-on-error: true
        run: |
          stamp=../data/symbols-fetched
          if [ ! -f "$stamp" ] || [ -n "$(find "$stamp" -mmin +1440)" ]; then
            uv run python -m finn.collectors.symbols && touch "$stamp"
          fi

      - name: Report which sources worked from the cloud
        if: always()
        run: |
          {
            echo "### FINN refresh"
            echo '```json'
            cat ../data/last-run.json 2>/dev/null || echo '{"error": "refresh did not produce a report"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit exported data if it changed
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data
          # Every commit redeploys the site, and each deployment stores a copy of the server.
          # When only meta.json's timestamp moved, skip it, unless the last data commit is
          # 90 minutes old: the app calls its data stale at two hours, and must not do so
          # because nothing happened.
          last=$(git log -1 --format=%ct --author=github-actions -- app/public/data)
          # (GitHub runs this with bash -e, so no command here may fail just to mean "no".)
          changed=$(git diff --cached --name-only)
          if [ "$changed" = "app/public/data/meta.json" ] && [ $(( $(date +%s) - ${last:-0} )) -lt 5400 ]; then
            echo "Only the timestamp changed; not redeploying for it."
            git reset -q
          elif git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Code may have been pushed while this ran; the bot only touches exported
            # data, so replaying its commit on top is safe.
            git pull --rebase origin main
            git push
          fi

      - name: Start the next run, 30 minutes after this one started
        # Runs even when a step above failed, so one bad run does not end the chain. It
        # starts a run only if none is already waiting or running: the hourly cron, or a
        # manual run, must not start a second chain.
        if: ${{ !cancelled() && github.repository == 'vatsal3512/finn' && vars.KEEP_REFRESHING != 'false' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 1800 - ($(date +%s) - STARTED) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          others=$(gh run list --workflow refresh.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .status != \"completed\")] | length")
          if [ "$others" = "0" ]; then
            gh workflow run refresh.yml --ref main
            echo "Next run started."
          else
            echo "$others other run(s) already waiting or running; not starting another."
          fi
